# Replace the allow address, server name, and certificate paths.
# The Python worker listens on 127.0.0.1:8787.

server {
    listen 443 ssl;
    server_name transcript.example.com;

    ssl_certificate     /etc/ssl/transcript-worker/fullchain.pem;
    ssl_certificate_key /etc/ssl/transcript-worker/privkey.pem;

    client_max_body_size 1024m;

    allow 203.0.113.10;
    deny all;

    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
